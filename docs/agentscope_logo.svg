<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="#0d1117"/>

  <!-- Outer thin ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- ── SCOPE / MAGNIFIER BODY ── -->
  <!-- Main circle of the scope -->
  <circle cx="55" cy="52" r="22" fill="none" stroke="#58a6ff" stroke-width="3.5"/>

  <!-- Inner ring (pupil) -->
  <circle cx="55" cy="52" r="13" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Centre dot -->
  <circle cx="55" cy="52" r="3.5" fill="#58a6ff"/>

  <!-- Crosshair lines -->
  <line x1="55" y1="30" x2="55" y2="39"  stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="55" y1="65" x2="55" y2="74"  stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="33"  y1="52" x2="42"  y2="52" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="68"  y1="52" x2="77"  y2="52" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ── HANDLE (magnifier grip) ── -->
  <line x1="70" y1="67" x2="88" y2="86"
        stroke="#58a6ff" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Handle highlight -->
  <line x1="70" y1="67" x2="88" y2="86"
        stroke="#cae8ff" stroke-width="1.5"
        stroke-linecap="round" opacity="0.35"/>

  <!-- ── SIGNAL DOTS (agent activity indicator) ── -->
  <circle cx="90" cy="28" r="4" fill="#3fb950"/>
  <circle cx="90" cy="42" r="4" fill="#3fb950" opacity="0.55"/>
  <circle cx="90" cy="56" r="4" fill="#3fb950" opacity="0.25"/>

  <!-- Activity label line -->
  <line x1="86" y1="28" x2="80" y2="28" stroke="#3fb950" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="86" y1="42" x2="80" y2="42" stroke="#3fb950" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="86" y1="56" x2="80" y2="56" stroke="#3fb950" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>

  <!-- ── CORNER BRACKETS (DevTools feel) ── -->
  <path d="M10 22 L10 10 L22 10" fill="none" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M110 22 L110 10 L98 10" fill="none" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M10 98 L10 110 L22 110" fill="none" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M110 98 L110 110 L98 110" fill="none" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>

</svg>
